<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E2429"/>
      <stop offset="1" stop-color="#12161A"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#bg)"/>
  <rect width="512" height="180" rx="104" fill="url(#glass)"/>

  <!-- sediment layers -->
  <g>
    <rect x="112" y="378" width="288" height="46" rx="14" fill="#6C7BD9"/>
    <rect x="132" y="330" width="248" height="42" rx="13" fill="#ABA192"/>
    <rect x="100" y="284" width="312" height="40" rx="13" fill="#E8A23D"/>
  </g>

  <!-- keystone glyph -->
  <text x="256" y="240" text-anchor="middle"
        font-family="Noto Serif SC, PingFang SC, Songti SC, serif"
        font-weight="900" font-size="196" fill="#F4E9D8">重</text>
</svg>
