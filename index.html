<title>字重</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&family=Noto+Sans+SC:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EDE8E1;
    --surface: #F7F4EF;
    --surface-hover: #EFEAE2;
    --text: #2B2724;
    --text-muted: #756C61;
    --border: #DCD4C6;
    --accent: #2F7A6B;
    --accent-contrast: #FBF8F2;
    --accent-soft: rgba(47, 122, 107, 0.12);

    --jar-bg: #171C20;
    --jar-bg-2: #1E2429;
    --jar-rim: #2C3540;
    --jar-ground: #0F1316;
    --jar-line: rgba(237, 232, 225, 0.07);
    --jar-label: #B9AF9F;

    --amber: #E8A23D;
    --indigo: #6C7BD9;
    --stone: #ABA192;

    --focus-ring: #2F7A6B;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12100F;
      --surface: #1C1917;
      --surface-hover: #252220;
      --text: #EDE6DC;
      --text-muted: #9C948A;
      --border: #322D28;
      --accent: #49B39E;
      --accent-contrast: #0E1211;
      --accent-soft: rgba(73, 179, 158, 0.16);
      --jar-label: #C8BFAF;
    }
  }

  :root[data-theme="dark"] {
    --bg: #12100F;
    --surface: #1C1917;
    --surface-hover: #252220;
    --text: #EDE6DC;
    --text-muted: #9C948A;
    --border: #322D28;
    --accent: #49B39E;
    --accent-contrast: #0E1211;
    --accent-soft: rgba(73, 179, 158, 0.16);
    --jar-label: #C8BFAF;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: clamp(16px, 3vw, 40px);
  }

  .page {
    width: 100%;
    max-width: 760px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  header.masthead {
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding-bottom: 4px;
  }

  .eyebrow {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  h1 {
    font-family: "Noto Serif SC", serif;
    font-weight: 900;
    font-size: clamp(30px, 5vw, 40px);
    line-height: 1.15;
    margin: 0;
    text-wrap: balance;
    letter-spacing: 0.01em;
  }

  h1 em {
    font-style: normal;
    color: var(--accent);
  }

  .tagline {
    color: var(--text-muted);
    font-size: 14.5px;
    line-height: 1.6;
    margin: 2px 0 0;
  }

  .console {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  textarea {
    width: 100%;
    min-height: 84px;
    max-height: 280px;
    overflow-y: auto;
    resize: none;
    background: transparent;
    color: var(--text);
    border: none;
    outline: none;
    font-family: "Noto Sans SC", system-ui, sans-serif;
    font-size: 14.5px;
    line-height: 1.65;
    padding: 2px;
  }

  textarea::placeholder { color: var(--text-muted); opacity: 0.85; }

  .console-controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    border-top: 1px solid var(--border);
    padding-top: 10px;
  }

  button {
    font-family: "Noto Sans SC", system-ui, sans-serif;
    font-size: 13.5px;
    font-weight: 500;
    border-radius: 999px;
    padding: 8px 16px;
    border: 1px solid var(--border);
    background: var(--surface-hover);
    color: var(--text);
    cursor: pointer;
    transition: background-color 120ms ease, border-color 120ms ease, transform 80ms ease;
  }

  button:hover { background: color-mix(in srgb, var(--surface-hover) 80%, var(--text) 6%); }
  button:active { transform: translateY(1px); }

  button:focus-visible {
    outline: 2px solid var(--focus-ring);
    outline-offset: 2px;
  }

  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-contrast);
    font-weight: 600;
  }
  button.primary:hover { filter: brightness(1.06); }
  button.primary:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    filter: none;
  }

  button.ghost { background: transparent; }

  .spacer { flex: 1; }

  .status-line {
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .jar-wrap {
    position: relative;
    border-radius: 30px 30px 60px 60px;
    background: var(--jar-bg);
    border: 1px solid var(--jar-rim);
    box-shadow: inset 0 2px 0 rgba(255,255,255,0.04), 0 18px 40px -20px rgba(0,0,0,0.5);
    overflow: hidden;
    padding: 0;
  }

  .jar-rim-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 14px;
    background: linear-gradient(180deg, var(--jar-rim), transparent);
    z-index: 3;
    pointer-events: none;
  }

  .jar-gauge {
    position: absolute;
    top: 14px; bottom: 22px; left: 10px;
    width: 1px;
    background: repeating-linear-gradient(
      to bottom,
      var(--jar-line) 0px, var(--jar-line) 1px,
      transparent 1px, transparent 28px
    );
    z-index: 2;
    pointer-events: none;
  }

  .gauge-tag {
    position: absolute;
    left: 16px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    color: var(--jar-label);
    opacity: 0.65;
    z-index: 3;
    pointer-events: none;
  }
  .gauge-tag.light { top: 16px; }
  .gauge-tag.heavy { bottom: 24px; }

  .jar-label {
    position: absolute;
    top: 12px;
    right: 16px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 10.5px;
    letter-spacing: 0.08em;
    color: var(--jar-label);
    opacity: 0.7;
    z-index: 3;
    pointer-events: none;
    text-transform: uppercase;
  }

  canvas {
    display: block;
    width: 100%;
    height: clamp(400px, 58vh, 580px);
    touch-action: none;
    cursor: default;
  }

  .tooltip {
    position: absolute;
    pointer-events: none;
    background: var(--jar-bg-2);
    border: 1px solid var(--jar-rim);
    color: #EDE6DC;
    font-family: "IBM Plex Mono", monospace;
    font-size: 11.5px;
    padding: 6px 9px;
    border-radius: 8px;
    line-height: 1.5;
    transform: translate(-50%, calc(-100% - 10px));
    white-space: nowrap;
    box-shadow: 0 6px 18px -6px rgba(0,0,0,0.5);
    z-index: 5;
    opacity: 0;
    transition: opacity 100ms ease;

  .tooltip.visible { opacity: 1; }
  .tooltip b { color: var(--amber); }
  .tooltip .neg { color: var(--indigo); }
  .tooltip .neu { color: var(--stone); }

  footer.legend {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    align-items: center;
    color: var(--text-muted);
    font-size: 12.5px;
    line-height: 1.5;
    padding: 2px 4px;

  .legend-item { display: inline-flex; align-items: center; gap: 6px; }
  .legend-dot { width: 9px; height: 9px; border-radius: 3px; display: inline-block; flex: none; }
  .dot-amber { background: var(--amber); }
  .dot-indigo { background: var(--indigo); }
  .dot-stone { background: var(--stone); }

  .about {
    color: var(--text-muted);
    font-size: 12.5px;
    line-height: 1.7;
    border-top: 1px solid var(--border);
    padding-top: 12px;
    margin-top: -2px;

  .about a { color: var(--accent); text-decoration: none; border-bottom: 1px solid currentColor; }

  @media (prefers-reduced-motion: reduce) {
    button { transition: none; }
  }

  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  @keyframes shake-x {
    10%, 90% { transform: translateX(-1px); }
    20%, 80% { transform: translateX(2px); }
    30%, 50%, 70% { transform: translateX(-4px); }
    40%, 60% { transform: translateX(4px); }
  }
  .console.shake { animation: shake-x 0.4s ease-in-out; }

  @media (prefers-reduced-motion: reduce) {
    .console.shake { animation: none; }
  }
</style>

<div class="page">
  <header class="masthead">
    <span class="eyebrow">Weight of Words · 文字沉积实验</span>
    <h1>字<em>重</em></h1>
    <p class="tagline">
      粘贴一段文字，每个词会按出现频次与情感强度被称重，投进这只样本瓶——<strong>越重的词沉得越深，越轻的飘在最上层</strong>，颜色告诉你它是暖的还是冷的。可以拖动，也可以一把吹散重新沉淀。
    </p>
  </header>

  <div class="console">
    <textarea id="input" placeholder="粘贴或输入一段文字…（中英文都可以）"></textarea>
    <div class="console-controls">
      <button class="primary" id="btn-drop">开始下落</button>
      <button class="ghost" id="btn-tidy">整理</button>
      <button class="ghost" id="btn-scatter">吹散</button>
      <button class="ghost" id="btn-clear">清空</button>
      <button class="ghost" id="btn-sample">试试示例文本</button>
      <button class="ghost" id="btn-save">保存图片</button>
      <button class="ghost" id="btn-share">复制分享链接</button>
      <div class="spacer"></div>
      <span class="status-line" id="status"></span>
    </div>
  </div>

  <div class="jar-wrap">
    <div class="jar-rim-bar"></div>
    <div class="jar-gauge"></div>
    <div class="gauge-tag light">轻 ↑</div>
    <div class="gauge-tag heavy">重 ↓</div>
    <div class="jar-label">SAMPLE JAR — TEXT SEDIMENT</div>
    <canvas id="canvas" aria-label="文字沉积可视化画布"></canvas>
    <div class="tooltip" id="tooltip"></div>
  </div>

  <footer class="legend">
    <span class="legend-item"><span class="legend-dot dot-amber"></span>暖色 = 情感积极</span>
    <span class="legend-item"><span class="legend-dot dot-indigo"></span>冷色 = 情感消极</span>
    <span class="legend-item"><span class="legend-dot dot-stone"></span>灰色 = 中性</span>
    <span class="legend-item">字号越大 = 出现越频繁</span>
  </footer>

  <p class="about">
    分词、情感词典、下落堆叠全部在你的浏览器里完成，不调用任何AI接口、不上传文字。拖动瓶里的词块可以把它捞出来重新丢下去（会落在你放的位置最上面，不会重新按重量排序），点一下能看到它的频次和情感倾向。
  </p>
  <div id="a11y-summary" class="sr-only" aria-live="polite"></div>
</div>

<script>
(() => {
  "use strict";

  // ---------- dictionaries ----------

  const STOPWORDS = new Set([
    "的","了","在","是","我","你","他","她","它","我们","你们","他们","这","那","这个","那个",
    "和","与","或","但","但是","就","也","都","还","又","很","非常","一个","一些","有","没有",
    "不","没","会","能","可以","要","把","被","让","给","从","到","对","为","于","之","其","而",
    "因为","所以","如果","虽然","然后","而且","并且","以及","等","等等","呢","吧","啊","哦","嗯",
    "呀","着","过","地","得","么","什么","怎么","这样","那样","一","二","三","上","下","中","里",
    "the","a","an","and","or","but","is","are","was","were","be","been","being","of","to","in",
    "on","at","for","with","as","by","from","this","that","these","those","it","its","he","she",
    "they","we","you","i","my","your","his","her","their","our","not","no","do","does","did",
    "have","has","had","will","would","can","could","should","may","might","just","so","very"
  ]);

  const SENTIMENT = {
    // Chinese — strong positive (+2)
    "爱":2,"幸福":2,"快乐":2,"美好":2,"希望":2,"温暖":2,"感动":2,"自由":2,"光明":2,"梦想":2,
    "骄傲":2,"珍惜":2,"感恩":2,"勇敢":2,"灿烂":2,"甜蜜":2,"温柔":2,"美丽":2,"喜悦":2,"欣慰":2,
    // Chinese — mild positive (+1)
    "开心":1,"高兴":1,"满意":1,"舒服":1,"顺利":1,"轻松":1,"有趣":1,"喜欢":1,"美":1,"好":1,
    "棒":1,"值得":1,"期待":1,"安心":1,"平静":1,"温馨":1,"欢喜":1,"惊喜":1,
    // Chinese — strong negative (-2)
    "痛苦":-2,"绝望":-2,"悲伤":-2,"恐惧":-2,"愤怒":-2,"孤独":-2,"崩溃":-2,"黑暗":-2,"冰冷":-2,
    "破碎":-2,"背叛":-2,"死亡":-2,"失望":-2,"悔恨":-2,"挣扎":-2,"撕裂":-2,"荒凉":-2,"绝情":-2,
    // Chinese — mild negative (-1)
    "难过":-1,"累":-1,"烦":-1,"焦虑":-1,"担心":-1,"麻烦":-1,"遗憾":-1,"无聊":-1,"讨厌":-1,
    "糟糕":-1,"疲惫":-1,"沉重":-1,"迷茫":-1,"委屈":-1,"忧愁":-1,"苦涩":-1,

    // English — strong positive (+2)
    "love":2,"happiness":2,"joy":2,"hope":2,"wonderful":2,"beautiful":2,"bright":2,"dream":2,
    "proud":2,"grateful":2,"brave":2,"radiant":2,"sweet":2,"gentle":2,"delighted":2,"amazing":2,
    // English — mild positive (+1)
    "happy":1,"glad":1,"pleased":1,"comfortable":1,"smooth":1,"relaxed":1,"fun":1,"like":1,
    "nice":1,"good":1,"great":1,"worth":1,"expect":1,"calm":1,"peaceful":1,"warm":1,
    // English — strong negative (-2)
    "pain":-2,"despair":-2,"sorrow":-2,"fear":-2,"anger":-2,"lonely":-2,"broken":-2,"dark":-2,
    "cold":-2,"shattered":-2,"betrayal":-2,"death":-2,"disappointed":-2,"regret":-2,"struggle":-2,"torn":-2,
    // English — mild negative (-1)
    "sad":-1,"tired":-1,"annoyed":-1,"anxious":-1,"worried":-1,"trouble":-1,"boring":-1,"hate":-1,
    "bad":-1,"terrible":-1,"exhausted":-1,"heavy":-1,"lost":-1,"wronged":-1
  };

  const SAMPLE_TEXT = "凌晨三点，屏幕的光还亮着。代码报错了第十七次，我几乎绝望，手指冰冷地悬在键盘上。可是重新读了一遍报错，忽然笑了——原来是我自己漏了一个括号。那种荒唐又踏实的快乐，像是黑暗里突然被点亮的希望。我保存、运行，测试全部通过，长久悬着的焦虑一下子松开了。这种疲惫过后的甜蜜，大概就是写代码这件事，最让人牵挂的地方。Debugging is exhausting, but the relief and joy when it finally works is worth every struggle.";

  // ---------- tokenize + score ----------

  function tokenize(text) {
    const tokens = [];
    if (typeof Intl !== "undefined" && Intl.Segmenter) {
      const seg = new Intl.Segmenter("zh", { granularity: "word" });
      for (const { segment, isWordLike } of seg.segment(text)) {
        if (isWordLike) tokens.push(segment);
      }
    } else {
      const re = /[A-Za-z0-9']+|[一-鿿]/g;
      let m;
      while ((m = re.exec(text))) tokens.push(m[0]);
    }
    return tokens;
  }

  function normalize(tok) {
    return /^[A-Za-z']+$/.test(tok) ? tok.toLowerCase() : tok;
  }

  function hasLetterOrDigit(tok) {
    try { return /[\p{L}\p{N}]/u.test(tok); } catch (e) { return /[A-Za-z0-9一-鿿]/.test(tok); }
  }

  const MAX_WORDS = 70;

  function analyze(text) {
    const freq = new Map();
    for (const raw of tokenize(text)) {
      const tok = normalize(raw.trim());
      if (!tok || !hasLetterOrDigit(tok)) continue;
      if (STOPWORDS.has(tok.toLowerCase()) || STOPWORDS.has(tok)) continue;
      freq.set(tok, (freq.get(tok) || 0) + 1);
    }

    const words = [...freq.entries()].map(([word, count]) => {
      const score = SENTIMENT[word] ?? SENTIMENT[word.toLowerCase()] ?? 0;
      const mass = 12 + Math.log(count + 1) * 7 + Math.min(word.length, 6) * 1.2 + Math.abs(score) * 4.5;
      return { word, count, score, mass };
    });

    words.sort((a, b) => b.mass - a.mass);
    const truncated = Math.max(0, words.length - MAX_WORDS);
    const sliced = words.slice(0, MAX_WORDS);
    if (sliced.length) sliced[0].champion = true; // heaviest word overall — marked as the jar's "keystone"
    return { words: sliced, totalUnique: words.length, truncated };
  }

  // ---------- color ----------

  function hexToRgb(hex) {
    const n = parseInt(hex.slice(1), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  function mix(c1, c2, t) {
    return c1.map((v, i) => Math.round(v + (c2[i] - v) * t));
  }
  const STONE = hexToRgb("#ABA192");
  const AMBER = hexToRgb("#E8A23D");
  const INDIGO = hexToRgb("#6C7BD9");

  function colorForScore(score) {
    const t = Math.min(Math.abs(score) / 2, 1);
    const [r, g, b] = score > 0 ? mix(STONE, AMBER, t) : score < 0 ? mix(STONE, INDIGO, t) : STONE;
    return `rgb(${r},${g},${b})`;
  }

  // ---------- canvas / simulation ----------

  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");
  const tooltip = document.getElementById("tooltip");
  const statusEl = document.getElementById("status");
  const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  let dpr = Math.max(1, window.devicePixelRatio || 1);
  let W = 0, H = 0;
  const WALL_MARGIN = 14;
  const FLOOR_MARGIN = 16;
  const GRAVITY = 1500;

  function resize() {
    const rect = canvas.getBoundingClientRect();
    dpr = Math.max(1, window.devicePixelRatio || 1);
    W = rect.width; H = rect.height;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    for (const b of settled) b.x = Math.min(Math.max(b.x, WALL_MARGIN), Math.max(WALL_MARGIN, W - WALL_MARGIN - b.w));
    render();
  }

  let settled = [];   // {x,y,w,h,fontSize,color,text,angle,count,score}
  let falling = [];   // {x,y,vx,vy,w,h,fontSize,color,text,phase,count,score}
  let queue = [];
  let spawnAcc = 0;
  const SPAWN_INTERVAL = 0.085;
  let dragging = null;
  let dragOffset = { x: 0, y: 0 };
  let pointerDownInfo = null;
  let hovered = null;
  let rafId = null;

  function measure(text, fontSize) {
    ctx.font = `600 ${fontSize}px "Noto Sans SC", system-ui, sans-serif`;
    const w = ctx.measureText(text).width;
    return { w: w + fontSize * 0.6, h: fontSize * 1.4 };
  }

  // Bucketed skyline, laid out for a whole batch up front: every item gets
  // a non-overlapping (x, targetY) slot before any of them start falling.
  // Doing this live per-spawn (querying `settled`) let several words that
  // are simultaneously mid-air — none of them landed yet — all aim at the
  // same "currently lowest" column, so they piled on top of each other and
  // hid one another. Precomputing the whole batch avoids that race.
  const BUCKET = 8;

  function packLayout(specs) {
    const usableW = Math.max(1, W - WALL_MARGIN * 2);
    const n = Math.max(1, Math.ceil(usableW / BUCKET));
    const floorY = H - FLOOR_MARGIN;
    const hm = new Float64Array(n).fill(floorY);
    const out = [];
    for (const spec of specs) {
      const spanBuckets = Math.max(1, Math.min(n, Math.ceil(spec.w / BUCKET)));
      const maxStart = Math.max(0, n - spanBuckets);
      let bestLanding = -Infinity;
      let candidates = [];
      for (let start = 0; start <= maxStart; start++) {
        let landing = Infinity;
        for (let i = start; i < start + spanBuckets; i++) landing = Math.min(landing, hm[i]);
        if (landing > bestLanding + 0.01) { bestLanding = landing; candidates = [start]; }
        else if (Math.abs(landing - bestLanding) <= 0.01) candidates.push(start);
      }
      const startB = candidates.length ? candidates[Math.floor(Math.random() * candidates.length)] : 0;
      const x = Math.min(Math.max(WALL_MARGIN + startB * BUCKET, WALL_MARGIN), Math.max(WALL_MARGIN, W - WALL_MARGIN - spec.w));
      const targetY = Math.max(bestLanding - spec.h, 2);
      const s2 = Math.max(0, Math.floor((x - WALL_MARGIN) / BUCKET));
      const e2 = Math.min(n - 1, Math.ceil((x + spec.w - WALL_MARGIN) / BUCKET));
      for (let i = s2; i <= e2; i++) hm[i] = Math.min(hm[i], targetY);
      out.push({ ...spec, targetX: x, targetY });
    }
    return out;
  }

  function stackTopFor(x, w) {
    let top = H - FLOOR_MARGIN;
    for (const s of settled) {
      if (x < s.x + s.w && x + w > s.x) {
        top = Math.min(top, s.y);
      }
    }
    return top;
  }

  function startDrop(items) {
    // items already sorted heaviest-first by analyze(): laying them out in
    // that order means heavy words claim the bottom, light ones end up on top.
    stopLoop();
    queue = packLayout(items.map((item) => {
      const fontSize = Math.max(12, Math.min(44, item.mass));
      const { w, h } = measure(item.word, fontSize);
      return { w, h, fontSize, color: colorForScore(item.score), text: item.word, count: item.count, score: item.score, champion: !!item.champion };
    }));
    spawnAcc = 0;
    if (reducedMotion) {
      for (const b of queue) {
        settled.push({ x: b.targetX, y: b.targetY, w: b.w, h: b.h, fontSize: b.fontSize, color: b.color, text: b.text, count: b.count, score: b.score, champion: b.champion, angle: (Math.random() - 0.5) * 0.12 });
      }
      queue = [];
      render();
      return;
    }
    loop();
  }

  function scatter() {
    if (!settled.length) return;
    stopLoop();
    const laid = packLayout(settled.slice().sort((a, b) => b.fontSize - a.fontSize));
    settled = [];
    for (const b of laid) {
      falling.push({
        x: b.targetX, y: Math.min(b.y, H - FLOOR_MARGIN - b.h),
        w: b.w, h: b.h, fontSize: b.fontSize, color: b.color,
        text: b.text, count: b.count, score: b.score, champion: b.champion,
        vx: (Math.random() - 0.5) * 60,
        vy: -(250 + Math.random() * 300),
        phase: Math.random() * Math.PI * 2, angle: 0,
        targetX: b.targetX, targetY: b.targetY
      });
    }
    if (reducedMotion) {
      for (const b of falling) {
        settled.push({ x: b.targetX, y: b.targetY, w: b.w, h: b.h, fontSize: b.fontSize, color: b.color, text: b.text, count: b.count, score: b.score, champion: b.champion, angle: (Math.random() - 0.5) * 0.12 });
      }
      falling = [];
      render();
      return;
    }
    loop();
  }

  function tidy() {
    if (!settled.length) return;
    stopLoop();
    falling = []; queue = [];
    const laid = packLayout(settled.slice().sort((a, b) => b.fontSize - a.fontSize));
    settled = laid.map((b) => ({
      x: b.targetX, y: b.targetY, w: b.w, h: b.h, fontSize: b.fontSize, color: b.color,
      text: b.text, count: b.count, score: b.score, champion: b.champion,
      angle: (Math.random() - 0.5) * 0.12
    }));
    render();
  }

  function clearAll() {
    stopLoop();
    settled = []; falling = []; queue = [];
    render();
    updateStatus(0, 0, null);
  }

  let lastT = null;
  function loop(ts) {
    if (lastT === null) lastT = ts ?? performance.now();
    const now = ts ?? performance.now();
    const dt = Math.min(0.033, (now - lastT) / 1000);
    lastT = now;

    spawnAcc += dt;
    while (queue.length && spawnAcc >= SPAWN_INTERVAL) {
      spawnAcc -= SPAWN_INTERVAL;
      const spec = queue.shift();
      falling.push({
        x: spec.targetX, y: -spec.h - Math.random() * 60,
        vx: (Math.random() - 0.5) * 8, vy: 0,
        w: spec.w, h: spec.h, fontSize: spec.fontSize, color: spec.color,
        text: spec.text, count: spec.count, score: spec.score, champion: spec.champion,
        phase: Math.random() * Math.PI * 2, angle: 0,
        targetX: spec.targetX, targetY: spec.targetY
      });
    }

    for (let i = falling.length - 1; i >= 0; i--) {
      const b = falling[i];
      b.vy += GRAVITY * dt;
      b.vx *= 0.985;
      b.phase += dt * 3.2;
      const wobble = Math.sin(b.phase) * 6;
      b.x += (b.vx * dt) + wobble * dt;
      b.y += b.vy * dt;

      if (b.x < WALL_MARGIN) { b.x = WALL_MARGIN; b.vx = Math.abs(b.vx) * 0.5; }
      if (b.x + b.w > W - WALL_MARGIN) { b.x = W - WALL_MARGIN - b.w; b.vx = -Math.abs(b.vx) * 0.5; }

      // each falling word already knows exactly where it's going to rest
      // (assigned up front by packLayout), so landing is just "did it get there".
      if (b.y >= b.targetY) {
        settled.push({
          x: b.targetX, y: b.targetY, w: b.w, h: b.h, fontSize: b.fontSize, color: b.color,
          text: b.text, count: b.count, score: b.score, champion: b.champion,
          angle: (Math.random() - 0.5) * 0.12
        });
        falling.splice(i, 1);
      }
    }

    render();

    if (falling.length || queue.length) {
      rafId = requestAnimationFrame(loop);
    } else {
      rafId = null;
      lastT = null;
    }
  }

  function stopLoop() {
    if (rafId) cancelAnimationFrame(rafId);
    rafId = null;
    lastT = null;
  }

  function drawBody(b) {
    ctx.save();
    ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
    ctx.rotate(b.angle || 0);
    ctx.fillStyle = "rgba(0,0,0,0.28)";
    roundRect(-b.w / 2 + 2, -b.h / 2 + 3, b.w, b.h, 8);
    ctx.fill();
    ctx.fillStyle = b.color;
    roundRect(-b.w / 2, -b.h / 2, b.w, b.h, 8);
    ctx.fill();
    ctx.fillStyle = "#14181B";
    ctx.font = `600 ${b.fontSize}px "Noto Sans SC", system-ui, sans-serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(b.text, 0, b.h * 0.02);

    if (b.champion) {
      const r = Math.max(7, b.fontSize * 0.24);
      ctx.translate(b.w / 2 - r * 0.7, -b.h / 2 + r * 0.7);
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.fillStyle = "#F4E3B2";
      ctx.fill();
      ctx.strokeStyle = "rgba(0,0,0,0.35)";
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.fillStyle = "#5A4300";
      ctx.font = `${r * 1.3}px system-ui, sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("★", 0, r * 0.05);
    }
    ctx.restore();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // Painted explicitly (rather than left transparent over the CSS jar
  // background) so a canvas.toBlob() export is a self-contained image.
  let JAR_BG = getComputedStyle(document.documentElement).getPropertyValue("--jar-bg").trim() || "#171C20";

  function render() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = JAR_BG;
    ctx.fillRect(0, 0, W, H);
    const groundGrad = ctx.createLinearGradient(0, H - 60, 0, H);
    groundGrad.addColorStop(0, "rgba(0,0,0,0)");
    groundGrad.addColorStop(1, "rgba(0,0,0,0.35)");
    ctx.fillStyle = groundGrad;
    ctx.fillRect(0, H - 60, W, 60);
    ctx.strokeStyle = "rgba(237,232,225,0.14)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, H - FLOOR_MARGIN + 0.5);
    ctx.lineTo(W, H - FLOOR_MARGIN + 0.5);
    ctx.stroke();

    ctx.font = '11px "IBM Plex Mono", monospace';
    ctx.fillStyle = "rgba(237,232,225,0.3)";
    ctx.textAlign = "right";
    ctx.textBaseline = "bottom";
    ctx.fillText("字重 · zizhong", W - 14, H - 8);

    for (const b of settled) if (b !== dragging) drawBody(b);
    for (const b of falling) drawBody(b);
    if (dragging) drawBody(dragging);
  }

  function updateStatus(unique, truncated, championWord) {
    if (!unique) { statusEl.textContent = ""; return; }
    const base = truncated > 0
      ? `共 ${unique} 个不同词 · 已显示前 ${unique - truncated} 个`
      : `共 ${unique} 个不同词`;
    statusEl.textContent = championWord ? `${base} · 镇瓶之词："${championWord}"` : base;
  }

  // ---------- pointer interaction ----------

  function bodyAt(x, y, list) {
    for (let i = list.length - 1; i >= 0; i--) {
      const b = list[i];
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b;
    }
    return null;
  }

  function canvasPoint(evt) {
    const rect = canvas.getBoundingClientRect();
    return { x: evt.clientX - rect.left, y: evt.clientY - rect.top };
  }

  function showTooltip(b, x, y) {
    const label = b.score > 0
      ? `<b>积极 +${b.score}</b>`
      : b.score < 0
        ? `<span class="neg">消极 ${b.score}</span>`
        : `<span class="neu">中性</span>`;
    const crown = b.champion ? "👑 镇瓶之词<br>" : "";
    tooltip.innerHTML = `${crown}“${b.text}” · 出现 ${b.count} 次<br>${label}`;
    tooltip.style.left = x + "px";
    tooltip.style.top = y + "px";
    tooltip.classList.add("visible");
  }
  function hideTooltip() { tooltip.classList.remove("visible"); }

  canvas.addEventListener("pointerdown", (evt) => {
    const p = canvasPoint(evt);
    const b = bodyAt(p.x, p.y, settled);
    pointerDownInfo = { x: p.x, y: p.y, moved: false, body: b };
    if (b) {
      settled = settled.filter((s) => s !== b);
      dragging = b;
      dragOffset = { x: p.x - b.x, y: p.y - b.y };
      canvas.setPointerCapture(evt.pointerId);
      hideTooltip();
    }
  });

  canvas.addEventListener("pointermove", (evt) => {
    const p = canvasPoint(evt);
    if (dragging) {
      if (pointerDownInfo) {
        const dx = p.x - pointerDownInfo.x, dy = p.y - pointerDownInfo.y;
        if (Math.hypot(dx, dy) > 4) pointerDownInfo.moved = true;
      }
      dragging.x = Math.min(Math.max(p.x - dragOffset.x, WALL_MARGIN), Math.max(WALL_MARGIN, W - WALL_MARGIN - dragging.w));
      dragging.y = Math.max(p.y - dragOffset.y, -dragging.h);
      dragging.angle = 0;
      render();
      return;
    }
    const b = bodyAt(p.x, p.y, settled);
    if (b) {
      hovered = b;
      canvas.style.cursor = "grab";
      showTooltip(b, p.x, p.y);
    } else if (hovered) {
      hovered = null;
      canvas.style.cursor = "default";
      hideTooltip();
    }
  });

  function endDrag(evt) {
    if (!dragging) { pointerDownInfo = null; return; }
    const moved = pointerDownInfo?.moved;
    const b = dragging;
    dragging = null;
    if (!moved) {
      // treat as a click: settle back exactly, show tooltip
      const top = stackTopFor(b.x, b.w);
      b.y = Math.min(b.y, top - b.h);
      settled.push(b);
      const p = canvasPoint(evt);
      showTooltip(b, p.x, p.y);
    } else {
      // a single manually-dropped word: safe to target live against the
      // current pile (no batch race, since nothing else is spawning here)
      const targetX = Math.min(Math.max(b.x, WALL_MARGIN), Math.max(WALL_MARGIN, W - WALL_MARGIN - b.w));
      const targetY = stackTopFor(targetX, b.w) - b.h;
      falling.push({ ...b, x: targetX, vx: 0, vy: 0, phase: Math.random() * Math.PI * 2, targetX, targetY });
      if (!rafId) loop();
    }
    pointerDownInfo = null;
    render();
  }
  canvas.addEventListener("pointerup", endDrag);
  canvas.addEventListener("pointercancel", endDrag);
  canvas.addEventListener("pointerleave", () => { if (!dragging) hideTooltip(); });

  // ---------- wiring ----------

  const input = document.getElementById("input");
  const consoleEl = document.querySelector(".console");
  const a11ySummary = document.getElementById("a11y-summary");

  function growInput() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 280) + "px";
  }
  input.addEventListener("input", growInput);

  function flashEmpty() {
    statusEl.textContent = "先粘贴点文字进来吧";
    consoleEl.classList.remove("shake");
    void consoleEl.offsetWidth; // restart the animation on repeated clicks
    consoleEl.classList.add("shake");
    setTimeout(() => consoleEl.classList.remove("shake"), 450);
    input.focus();
  }

  function updateA11ySummary(words) {
    if (!words.length) { a11ySummary.textContent = ""; return; }
    const top = words.slice(0, 15).map((w) =>
      `${w.word}（${w.count} 次，${w.score > 0 ? "积极" : w.score < 0 ? "消极" : "中性"}）`
    ).join("、");
    a11ySummary.textContent = `按重量从高到低：${top}`;
  }

  function doDrop() {
    const { words, totalUnique, truncated } = analyze(input.value);
    if (!words.length) { flashEmpty(); return; }
    settled = []; falling = []; queue = [];
    startDrop(words);
    updateStatus(totalUnique, truncated, words[0].word);
    updateA11ySummary(words);
  }

  // ---------- share link ----------

  function getSharedText() {
    const m = location.hash.match(/t=([^&]*)/);
    if (!m) return null;
    try { return decodeURIComponent(m[1]); } catch (e) { return null; }
  }
  function buildShareUrl(text) {
    return location.href.split("#")[0] + "#t=" + encodeURIComponent(text);
  }

  document.getElementById("btn-drop").addEventListener("click", doDrop);
  document.getElementById("btn-tidy").addEventListener("click", tidy);
  document.getElementById("btn-scatter").addEventListener("click", scatter);
  document.getElementById("btn-clear").addEventListener("click", () => { clearAll(); });
  document.getElementById("btn-sample").addEventListener("click", () => { input.value = SAMPLE_TEXT; growInput(); });

  // In the Claude artifact preview, the `downloads` capability hands the
  // file to the viewer's own save prompt. On plain web hosting (e.g. the
  // GitHub Pages copy) `window.claude` doesn't exist, so fall back to a
  // normal browser download link.
  async function saveDownload(filename, blob) {
    if (window.claude && typeof window.claude.use === "function") {
      try {
        const downloads = await window.claude.use("downloads");
        if (downloads) { await downloads.save({ filename, data: blob }); return; }
      } catch (e) {
        return; // viewer declined, or saves unavailable here — no auto-retry
      }
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }

  document.getElementById("btn-save").addEventListener("click", () => {
    canvas.toBlob((blob) => { if (blob) saveDownload("zizhong.png", blob); });
  });

  const shareBtn = document.getElementById("btn-share");
  shareBtn.addEventListener("click", async () => {
    const text = input.value.trim();
    if (!text) { flashEmpty(); return; }
    const url = buildShareUrl(text);
    const original = shareBtn.textContent;
    try {
      await navigator.clipboard.writeText(url);
      shareBtn.textContent = "已复制链接 ✓";
    } catch (e) {
      shareBtn.textContent = "复制失败，请手动复制地址栏";
    }
    setTimeout(() => { shareBtn.textContent = original; }, 1800);
  });

  window.addEventListener("resize", resize);
  resize();
  growInput();

  const sharedText = getSharedText();
  if (sharedText) { input.value = sharedText; growInput(); }

  function afterFontsReady() {
    resize();
    if (sharedText) doDrop();
  }
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(afterFontsReady);
  } else {
    afterFontsReady();
  }
})();
</script>
